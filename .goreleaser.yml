version: 2

snapshot:
  # Local and CI release candidates must use the source manifest version rather
  # than whichever historical tag happens to be nearest to the checkout.
  version_template: '{{ envOrDefault "AETHER_RELEASE_VERSION" .Version }}'

before:
  hooks:
    - go mod tidy
    - git diff --exit-code -- go.mod go.sum
    - go test ./cmd -run TestDocCLIAlignment -v

builds:
  - main: ./cmd/aether/
    binary: aether
    ldflags:
      - -X github.com/calcosmic/Aether/cmd.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    builds_info:
      group: root

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
