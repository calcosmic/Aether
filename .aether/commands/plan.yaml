name: ant-plan
description: "📋 Generate a depth-scoped colony plan with real Scout and Route-Setter agents"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "aether host plan --depth <fast|balanced|deep|exhaustive> --planning-depth <light|standard|deep> --verification-depth <light|standard|heavy> --target <70-99> --max-iterations <2-12>"
  contract: ".aether/docs/wrapper-host-contract.md"
codex_orchestration:
  category: "full-orchestration"
  skill: "aether-colony-build-cycle"
  guide: "aether command-guide plan --platform codex"
  drift_guard: "Update this YAML, Claude/OpenCode wrappers, the Codex skill, and cmd/command_guide.go together."
wrapper_additions:
  depth_proposal_card: |
    The plan flow has exactly two decision moments; this is the first. Request a first manifest with `aether host plan`, omitting `--depth`, `--planning-depth`, and `--verification-depth` unless the user already named them, so the runtime computes its smart defaults and a plain-English reason for each of the three knobs (granularity, task decomposition depth, verification depth) together.
    Print `result.depth_proposal_card` verbatim — do not restate, summarize, or re-reason the recommendations; the runtime computes the reasons and the wrapper only prints the card it is given.
    Accept the recommendations on a single confirmation, or, when the user names a knob and an option number, request a fresh manifest with the corresponding `--depth` / `--planning-depth` / `--verification-depth` flag set to that option's value. Never ask the user to type a value.
    Under `/ant-run`, accept the depth recommendations without prompting.
  research_batch_card: |
    The second and final decision moment. After the planning manifest is fetched, print `result.research_proposal_card` verbatim when it is non-empty — do not compose your own recommendation or reason.
    Approve the batch with `aether plan-research-approve --approve-all`, or flip specific phases with `aether plan-research-approve --flip <ids>`. Request a fresh manifest afterward so the gated `phase_research` dispatches appear, and surface `result.research_warning` whenever `result.research_awaiting_approval` is true.
    On a fast run the Queen recommends skip for every phase, the batch still appears, and a flipped-on phase researches at the fast preset's 80% / 4-iteration budget.
    Under `/ant-run`, answer the research batch with `aether plan-research-approve --auto` and print the returned `log_line` in the run log. Autopilot never pauses for either decision moment.
  iterative_planning_ceremony: |
    Restore the classic planning-loop controls while leaving state writes to Go:
    - `--target <70-99>` sets the confidence target. Presets default to fast=80, balanced=90, deep=95, exhaustive=99. These bounds also govern per-phase research iteration under the confidence loop.
    - `--max-iterations <2-12>` sets the loop budget. Presets default to fast=4, balanced=6, deep=8, exhaustive=12. This budget also bounds per-phase research iteration.
    - `--accept` records that the current best plan may finalize below target.
    Each `aether host plan` response is one planning iteration manifest. It includes `planning_run_id`, `iteration`, `target_confidence`, `max_iterations`, `previous_confidence`, `selected_gaps`, `previous_plan_draft`, and the expected workers: one Scout (plus any phase_research Scouts, one per approved research phase) in wave 1, followed by one Route-Setter in wave 2.
    The wrapper loops by dispatching Scout, then Route-Setter with the Scout result, then calling `plan-finalize`. If `plan-finalize` returns `requires_next_iteration: true`, request a fresh `aether host plan` manifest and repeat. Do not reuse the previous manifest or completion packet.
    The runtime emits `planning_loop.stop_reason` as `pending`, `target_reached`, `stalled`, `max_iterations`, or `accepted`; wrappers must surface that reason and must not hand-edit state.
    Confidence may only increase when the Scout/Route-Setter evidence changes or selected gaps are resolved; `plan-finalize` rejects confidence-only bumps.
  revision_ceremony: |
    When refreshing a plan after any phase completed, treat it as a versioned revision rather than a reset:
    - Pass `--refresh --revision-type <user_feedback|research|verification_failure|scope_change|manual> --revision-reason "<why>"` to every `aether host plan` iteration.
    - For research or verification-driven revisions, also pass one or more repository-relative `--revision-evidence <path>` files.
    - Preserve the manifest `revision` context and each worker brief verbatim. Completed phases are immutable; Route-Setter outputs replacement unfinished phases only.
    - Surface the accepted `plan_revision` ID, reason, preserved phase IDs, and replacement phase IDs from `plan-finalize`.
    - Never reuse a planning or build packet from the superseded revision.
  post_plan: |
    Close from the `plan-finalize` result only:
    1. If `requires_next_iteration` is true, do not render final closeout. Request the next manifest and continue the loop unless the runtime reports a stop condition, provider unavailable, or the user explicitly accepts below target.
    2. After the JSON finalizer succeeds with a completed plan, run the visual closeout command first; use its next-step line as the source of truth.
    3. Summarize selected depth, planning depth, phase count, confidence, `planning_loop.stop_reason`, and which planning agents ran.
    4. Route first to `/ant-build 1` or the runtime-surfaced next build command.
    5. If finalization blocks, follow the runtime recovery command first.
guardrails:
  - "The TS host is the sole entry point to the Go CLI; respect orchestrator_boundary_guidance and route to aether discuss when the boundary is active."
  - "After a discuss redirect, request a fresh manifest after_discuss_next; never reuse a pre-discuss manifest — always fresh."
  - "Use visible live Task/subagent panels for plan ceremony. Run aether spawn-log before each dispatch and aether spawn-complete after."
  - "Inspect each planning dispatch permission_profile. Scout repository_read_only must use a host-enforced no-write boundary; never replace it with an unrestricted agent or a prompt-only promise."
  - "Do NOT run direct `aether plan` from Claude/OpenCode wrapper orchestration for manifest generation; use `aether host plan`."
  - "Do NOT run `aether plan --synthetic` after real wrapper Task agents complete."
  - "Do NOT read or write colony state files, session files, planning artifacts, or pheromone files by hand from this command spec."
  - "Do NOT parse visual output as authoritative state."
  - "Do NOT invent Scout or Route-Setter names, castes, waves, or task IDs; use `plan_manifest`."
  - "Do NOT dispatch planning workers beyond the manifest dispatch list. The contract is Scout plus manifest-listed phase_research Scouts in wave 1, then one Route-Setter in wave 2, per iteration."
  - "Do NOT treat `requires_next_iteration: true` as a completed colony plan."
  - "Do NOT reuse a manifest or completion packet across iterations."
  - "Do NOT hand-edit, repeat, or renumber completed phases during a revision; the Go finalizer owns completed-prefix preservation and final IDs."
  - "Do NOT describe platform workers as background agents or replace the live worker stack with a markdown table."
  - "Do NOT add a third decision moment; the plan flow has exactly two — the depth proposal card and the research batch card."
  - "Do NOT route either decision-moment card through `aether discuss`; the discuss redirect remains only for `orchestrator_boundary_guidance`."
  - "Do NOT compose depth recommendations, reasons, or research recommendations in the wrapper; print the runtime-emitted card verbatim."
  - "If docs and runtime disagree, runtime wins."
