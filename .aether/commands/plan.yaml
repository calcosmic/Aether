name: ant-plan
description: "📋 Run an evidence-backed Scout to Route-Setter planning loop and review the exact candidate"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "aether host plan"
  manifest_command: "aether host plan --preset <fast|balanced|deep|exhaustive>"
  finalizer_command: "aether plan-finalize --completion-file <completion_file>"
  contract: ".aether/docs/wrapper-host-contract.md"
codex_orchestration:
  category: "full-orchestration"
  skill: "aether-colony-build-cycle"
  guide: "aether command-guide plan --platform codex"
  drift_guard: "Update this YAML, Claude/OpenCode wrappers, the Codex skill, cmd/command_guide.go, and public plan contract together."
wrapper_additions:
  approved_specification_preflight: |
    Inspect the canonical specification through `AETHER_OUTPUT_MODE=json aether spec --inspect` before choosing a preset or issuing a worker. Planning may start only from the exact APPROVED revision returned by Go. A missing, draft, stale, drifted, or unreconciled specification stops with State: unchanged and routes to `/ant-spec` or the runtime's exact repair action. Specification approval is never plan acceptance.
  preset_selection: |
    When no valid explicit quality flag is present, request `aether host plan` without a preset and render the runtime's `preset_required` result as exactly four unbiased choices:

    Fast        Target 80   Up to 4 passes
    Balanced    Target 90   Up to 6 passes
    Deep        Target 95   Up to 8 passes
    Exhaustive  Target 99   Up to 12 passes

    No option is preselected, recommended, or silently chosen. Invalid, blank, cancelled, or interrupted input starts no worker and leaves state unchanged. After one exact selection, request a fresh manifest with `aether host plan --preset <fast|balanced|deep|exhaustive>`. Valid explicit owner flags bypass only this card; Go still validates the approved specification and preset bounds.
  staged_scout_route_loop: |
    A planning result initially authorizes exactly one Scout through `plan_manifest.stage_manifest`. Dispatch only that stage, pass its exact manifest and brief, then submit its strict `scout_result` with the unchanged `plan_manifest` to `aether plan-finalize --completion-file <completion_file>`. Render `stage_receipt`, admitted evidence, remaining gaps, and the returned next boundary.
    Route-Setter has no authority until Scout finalization returns `route_stage_manifest`. Dispatch exactly one Route-Setter only from that manifest, bind the completed Scout receipt, and submit its strict `route_result` through a fresh completion file. Never combine Scout and Route-Setter results into a retired whole-chain packet, predict the next stage, reuse a consumed manifest, or dispatch beyond the exact runtime authorization.
  material_decision_boundaries: |
    If the first Scout result returns `decision_batch` and `decision_cards`, render the complete evidence-first batch before Route-Setter is issued. Every card includes the decision, why now, evidence, Queen recommendation, viable-choice consequences, prior-answer/revalidation state, and exact resume condition. Collect all owner choices in one host-native interaction and resume only with the exact completed token/result issued by Go; never compose, truncate, answer, or hand-mint a token.
    A material choice discovered later appears only after the completed pass's `iteration_card` has been rendered. Pause at that pass boundary; the active plan remains unchanged. Routine read-only phase research is automatic inside the selected preset and never creates a separate approval checkpoint.
  iteration_card_and_timeline: |
    After every completed Route-Setter stage, render the runtime-issued `iteration_card` exactly once. Preserve fresh evidence, all five before-to-after readiness dimensions, derived overall against target, weakest gap, evidence that would change it, semantic plan delta, authority impact, and the causal continue/pause/stop reason. Cards append to the ordered timeline; wrappers never calculate scores, materiality, semantic changes, or stop policy.
    Continue only when Go returns `scout_stage_manifest`, which targets the weakest evidenced gap for the next pass. A later material decision pauses after its card. Target sufficiency, diminishing returns, detected stall, or the selected pass cap creates a reviewable candidate only; stopping never activates a plan.
  candidate_review_and_acceptance: |
    When Go returns `plan_candidate`, label it NOT ACTIVE and run `AETHER_OUTPUT_MODE=json aether plan --candidate` for the full review. Render the exact candidate, approved specification binding, base revision, preset and stop reason, five readiness scores, remaining gaps and evidence that would change them, semantic delta, Queen recommendation, complete ordered timeline, and proposed plan. Do not offer build or Autopilot yet.
    After the owner explicitly confirms the exact reviewed candidate, execute `acceptance_command` verbatim. It is the receipt-bound `aether plan --accept-candidate <candidate-id>` command with the exact specification, base-plan, timeline, proposal, and acceptance-token bindings returned by Go. Never reconstruct, shorten, or substitute it. Only a successful `acceptance_receipt` makes the accepted revision READY and exposes `/ant-build 1` and `/ant-run` as coequal next actions.
  context_capsule_delivery: |
    Read `plan_manifest.context_capsule` once from the initial manifest and prepend it verbatim to the authorized Scout brief. For every later stage, use only the context, evidence frontier, weakest gap, prior receipt/card, and result contract carried by that stage's runtime-issued authorization; never synthesize additional owner steering or widen permissions.
  revision_ceremony: |
    A refresh remains a versioned revision bound to the approved specification and current base plan. Preserve completed work and unaffected semantic IDs, surface any successor draft or reconciliation boundary, and do not reuse a stage result, candidate, or acceptance command after the specification, base plan, proposal, or timeline changes.
  stage_skeleton: |
    Every stage uses one colony beat, Purpose, Reads, Spawns when applicable, imperative instructions, and Stop conditions. Carry only runtime-returned identifiers and artifacts across stages: approved specification binding, selected preset, planning run/pass, current stage manifest, stage receipt, weakest gap, completed card/timeline digest, candidate ID/hash, and next action.
guardrails:
  - "The host adapter is the manifest entry point; use structured Go results and never parse visual output as state."
  - "Dispatch exactly one runtime-authorized stage at a time: Scout first, then Route-Setter only after the Scout receipt, then later Scout stages only after completed cards."
  - "Use visible live Task/subagent panels. Run aether spawn-log before each dispatch and aether spawn-complete afterward."
  - "Pass every returned permission_profile, identity, stage manifest, result contract, context capsule, and brief verbatim; never substitute or broaden them."
  - "Do not synthesize worker success, stage receipts, evidence, confidence, semantic deltas, stop reasons, decisions, candidates, acceptance commands, or next actions."
  - "Do not dispatch routine phase-research workers from a wrapper-authored list or ask for separate research approval; follow only the current runtime authorization."
  - "Do not reuse a consumed stage manifest, completion packet, decision token, candidate review, or acceptance command across a changed frontier."
  - "Do not edit planning artifacts, specification files, colony state, sessions, receipts, or pheromone files by hand."
  - "Do not treat preset selection, specification approval, a stop reason, or a candidate as plan acceptance."
  - "Do not expose build or Autopilot until exact candidate acceptance succeeds."
  - "If docs and runtime disagree, runtime wins."
