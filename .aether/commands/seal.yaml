name: ant-seal
description: "Close a verified colony, or explicitly record an owner-forced incomplete closure."
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "aether host seal $ARGUMENTS"
codex_orchestration:
  category: "semi-intelligent"
  skill: "aether-colony-build-cycle"
  guide: "aether command-guide seal --platform codex"
  drift_guard: "Update this YAML, Claude/OpenCode wrappers, the Codex skill, and cmd/command_guide.go together."
wrapper_contract:
  manifest: "result.seal_manifest"
  review_team: "the program's own choice of reviewers for this project — picked from the project's own progress and how deep the check runs, never a fixed list; a security reviewer joins only once the review reaches its deepest setting, which happens automatically after the project shipped real production work (or when the final stage of work is itself clearly security-related); the exact reviewers for this run are named in the plan the command prints before it starts"
  finalizer: "AETHER_OUTPUT_MODE=json aether seal-finalize --completion-file <file>"
  instructions: |
    0. The Go runtime owns final review, preflight, confirmation, transaction, and rendering. Force flags pass only when directly supplied by the owner. A forced-incomplete closure is not verified success.
    1. Run `aether host seal $ARGUMENTS` and save the full JSON envelope to a temporary manifest file outside `.aether/data/`.
    2. If the runtime returns blockers, surface them and stop.
    3. Parse `result.seal_manifest`.
    4. Before rendering spawn ceremonies or spawning final-review workers, inspect `result.orchestrator_boundary_guidance` and the matching manifest `orchestrator_boundary_guidance`. If it is active or `next` is `aether discuss`, stop the seal flow, show its summary, route to `aether discuss`, tell the user to rerun `after_discuss_next`, and request a fresh plan-only manifest after the answer is resolved. Do not reuse the pre-discuss manifest.
    5. Dispatch the listed final-review workers through the host platform.
    6. Render `AETHER_FORCE_COLOR=1 AETHER_OUTPUT_MODE=visual aether ceremony spawn-plan --workflow seal --manifest-file <manifest_file>` so the final-review stack appears before live reviewers.
    7. Use visible live Task/subagent panels as the final-review ceremony. Do not set `run_in_background`, do not describe reviewers as background agents, and do not replace the live stack with a markdown worker table.
    8. Before each manifest wave, render `AETHER_FORCE_COLOR=1 AETHER_OUTPUT_MODE=visual aether ceremony wave-start --workflow seal --manifest-file <manifest_file> --execution-wave <execution_wave>`.
    9. Call `aether spawn-log` before each worker and `aether spawn-complete` after each terminal result.
    10. Write per-reviewer JSON and the final completion JSON under `${TMPDIR:-/tmp}/aether-seal-<run>/seal-completion.json`; never write wrapper result artifacts under `.aether/data`.
    11. After each terminal reviewer result, write that one result to an approved temp JSON file and render `AETHER_OUTPUT_MODE=visual aether ceremony worker-complete --workflow seal --worker-file <worker_file>`.
    12. Each spawned reviewer description must be caste-labelled from the manifest: `{caste emoji} {Caste} {name}: {task}`.
    13. Write a completion packet containing `seal_manifest` plus terminal worker `dispatches`. Preserve optional structured review fields: `findings`, `issues`, `recommendations`, `weak_spots`, `edge_cases_discovered`, and `reusable_lessons`.
    14. Run `AETHER_OUTPUT_MODE=json aether seal-finalize --completion-file <file>`.
    15. After the JSON finalizer succeeds, run `AETHER_OUTPUT_MODE=visual aether ceremony closeout --workflow seal --completion-file <file>` for the user-facing ceremony.
    16. Follow the runtime's Porter readiness output from visual mode; do not deliver unless the user selects delivery actions.
guardrails:
  - "Show this output to the owner in your own reply, unchanged — you are only passing along what the command already produced, not deciding, checking, or changing anything yourself."
  - "Close a verified colony, or explicitly record an owner-forced incomplete closure."
  - "Force flags pass only when directly supplied by the owner."
  - "The Go runtime owns final review, preflight, confirmation, transaction, and rendering."
  - "A forced-incomplete closure is not verified success."
  - "After sealing, run `AETHER_OUTPUT_MODE=visual aether status` first to review the retained sealed state; `aether entomb` is a separate optional owner-confirmed archive-and-clear action."
  - "Never invoke entomb automatically; sealing retains active state for owner review."
  - "Do not write colony state files, session files, or pheromone files by hand from this command spec."
  - "Do not bypass `aether host seal` from Claude/OpenCode orchestration unless the user explicitly asks for raw/no-orchestration."
  - "Do not run Porter delivery commands unless the user explicitly chooses them after seal-finalize."
  - "Do not describe platform reviewers as background agents or replace the live worker stack with a markdown table."
  - "Do not drop structured reviewer findings; seal-finalize persists them to final-review.json, review ledgers, the post-seal backlog, and QUEEN.md lessons when supplied."
  - "If docs and runtime disagree, runtime wins."
