name: ant-build
description: "🔨 Build a phase — Queen dispatches workers, colony self-organizes"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  manifest_command: "aether host build --dry-run $ARGUMENTS"
  finalizer_command: "aether build-finalize $ARGUMENTS --completion-file <go_owned_completion_path>"
  contract: ".aether/docs/wrapper-host-contract.md"
ownership:
  manifest_authority: "TS host (aether host build --dry-run returns plan-only JSON without dispatching workers)"
  worker_conductor: "Wrapper (spawns workers via platform Agent tool, manages ceremony)"
  state_mutator: "Go runtime (build-finalize commits results)"
codex_orchestration:
  category: "full-orchestration"
  skill: "aether-colony-build-cycle"
  guide: "aether command-guide build --platform codex"
  drift_guard: "Update this YAML, Claude/OpenCode wrappers, the Codex skill, and cmd/command_guide.go together."
wrapper_additions:
  pre_build: |
    Ground the build before planning:
    1. Run `AETHER_OUTPUT_MODE=visual aether status` to see current colony state, phase progress, and active signals.
    2. Surface active pheromones as a compact steering block with REDIRECT first, then FOCUS, then FEEDBACK.
    3. Include strength or remaining-life context so the user understands why each signal matters right now.
    4. Frame the requested work as `Phase N of M — Name` with a one-line purpose.
  manifest_fetch: |
    Fetch the dispatch manifest from the TS host in plan-only mode:
    1. Run `aether host build --dry-run $ARGUMENTS`.
    2. The TS host calls `aether build <phase> --plan-only` and returns JSON without dispatching workers.
    3. Parse `result.manifest.dispatch_manifest` for the dispatch plan.
    4. Save the full JSON envelope to a temporary manifest file outside `.aether/data/`.
    5. If provider dispatch is unavailable, surface only the Go-owned structured availability message.
    6. Each dispatch may carry `brief_path` -- a repo-display path to a file holding the identical composed brief (same bytes as inline `dispatch.brief`, byte for byte). Prefer reading `brief_path` verbatim; it is the channel that avoids Read-tool long-line truncation on 6-22KB briefs. Fall back to inline `dispatch.brief` only when `brief_path` is absent.
  post_build: |
    Close with a short colony-language synthesis:
    1. Stage the accepted temp packet with `aether build-completion-stage <phase> --completion-file <temp completion>` and finalize only the returned Go-owned `completion_path`.
    2. Run the visual closeout command with that durable packet; use its next-step line as the source of truth.
    3. Summarize what moved forward and which workers/castes actually ran.
    4. Note only the most relevant signal or risk.
    5. Route first to `/ant-continue`, keeping `aether continue` as the runtime source of truth beneath the wrapper.
  stage_skeleton: |
    Every non-exempt stage in build.md follows one order: a colony beat, then
    `**Purpose:**`, then `**Reads:**`, then `**Spawns:**` where the stage
    spawns anything, then the stage's instructions, then `**Stop
    conditions:**`. The named cross-stage state carry (`## Required
    Cross-Stage State`) lists: `phase_id`, `verification_depth`,
    `manifest_file`, `context_capsule`, `wave_results`,
    `verification_status`, `next_action`.
  ownership_chain: |
    build.md's structural ownership is recorded in the file itself: Phase 160
    (Fail Loudly) merged first and made only narrow call-argument fixes;
    Phase 165 (Core Lifecycle Commands) is the sole structural owner of this
    file for milestone v1.25; Phase 168 (Live Visibility) appends a
    visual-guidance trailer afterward, at the reserved marker
    `<!-- PHASE-168: visual-guidance trailer appends below this line -->`,
    which is always the last non-empty line of the file.
guardrails:
  - "The TS host is the sole manifest authority; always use `aether host build --dry-run` to fetch the plan, never `aether host build` alone (which dispatches workers via the TS host path, causing double-dispatch)."
  - "The wrapper is the sole conductor for interactive worker spawning; spawn workers via platform Agent tool from the manifest, not from the TS host."
  - "Respect orchestrator_boundary_guidance and route to aether discuss when the boundary is active."
  - "After a discuss redirect, request a fresh manifest after_discuss_next; never reuse a pre-discuss manifest."
  - "Use visible live Task/subagent panels for build ceremony. Run aether spawn-log before each dispatch and aether spawn-complete after. Call build-finalize only after all terminal worker results are collected."
  - "Inspect each dispatch permission_profile before spawning it. Never broaden repository_read_only. Reject scoped_write or test_write unless the host can enforce it. behavioral_restrictions inside workspace_write are required conduct, not a sandbox guarantee."
  - "Before build-finalize, call build-completion-stage exactly once with the accepted temp packet and pass only its Go-owned completion_path to build-finalize and closeout."
  - "Do NOT read or write colony state files by hand."
  - "Do NOT mutate COLONY_STATE.json, session.json, or pheromone files."
  - "Do NOT parse visual output as authoritative state."
  - "Do NOT expose raw provider stdout/stderr, tokens, or auth probe output; use the Go availability category and sanitized next action."
  - "Do NOT run `aether host build` without `--dry-run` from the wrapper; that triggers the TS host dispatched path which duplicates the wrapper's own worker spawning."
  - "Do NOT run `aether build --synthetic` after real wrapper Task agents complete."
  - "Do NOT describe parallel workers as background agents or say you will be notified later; keep the live worker stack visible until terminal results return."
  - "Do NOT add extra option menus or recovery advice unless the runtime explicitly asks."
  - "Do NOT hand-render any visual that `aether ceremony` already renders (spawn plans, wave starts, worker completions, closeouts, caste legends); invoke the renderer and narrate around it."
  - "Do NOT reintroduce the retired `colony_depth` vocabulary (light/standard/deep/full); the live vocabulary is `--verification-depth <light|standard|heavy>`."
  - "If docs and runtime disagree, runtime wins."
follow_up:
  verify: "Guide the user first to `/ant-continue`, with `aether continue` as the runtime source of truth."
  inspect: "Run `aether status` if you want to inspect progress before advancing."
