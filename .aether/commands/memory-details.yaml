name: ant-memory-details
description: "📜 Show what the colony has learned — wisdom, lessons waiting to be promoted, lessons put aside, and recent failures"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "AETHER_OUTPUT_MODE=visual aether memory-details $ARGUMENTS"
guardrails:
  - "Do not write colony state files, session files, or pheromone files by hand from this command spec."
  - "If docs and runtime disagree, runtime wins."
