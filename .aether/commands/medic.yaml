name: ant-medic
description: "🩹 Diagnose colony health — scan all colony data for corruption, staleness, and configuration issues"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "AETHER_OUTPUT_MODE=visual aether medic $ARGUMENTS"
flags:
  - name: fix
    description: "Enable repair mode (default: read-only scan)"
    type: boolean
    default: false
  - name: force
    description: "Allow destructive repairs (requires --fix)"
    type: boolean
    default: false
  - name: json
    description: "Output structured JSON report"
    type: boolean
    default: false
  - name: deep
    description: "Include wrapper parity, hub publish integrity, and ceremony checks"
    type: boolean
    default: false
  - name: trace
    description: "Analyze a trace export JSON file instead of active colony data"
    type: string
guardrails:
  - "For stale per-command session state, inspect with `aether session-verify-fresh --command <name>`, preview with `aether session-clear --command <name> --dry-run`, then clear the named scope only. Protected scopes (init, seal, entomb) refuse to clear; do not work around that."
  - "Do not write colony state files, session files, or pheromone files by hand from this command spec."
  - "If docs and runtime disagree, runtime wins."
  - "Read-only by default; --fix required for any mutation."
  - "Backs up before repair; --force required for destructive ops."
  - "Exit codes: 0=healthy, 1=warnings, 2=critical."
  - "Show this output to the owner in your own reply, unchanged — you are only passing along what the command already produced, not deciding, checking, or changing anything yourself."
  - "Show it in a fenced text block, from the first banner line (the line drawn with `━━`) to the end; leave out any running commentary above that line. After it, add at most two short sentences of your own, and never restate or replace the screen."
