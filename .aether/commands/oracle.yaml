name: ant-oracle
description: "🔮 Run the autonomous Oracle loop through the Aether CLI runtime"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "AETHER_OUTPUT_MODE=visual aether oracle $ARGUMENTS"
codex_orchestration:
  category: "full-orchestration"
  skill: "aether-colony-research"
  guide: "aether command-guide oracle --platform codex"
  drift_guard: "Update this YAML, Claude/OpenCode wrappers, the Codex skill, and cmd/command_guide.go together."
ceremony_contract:
  class: "guided_ritual"
  authority: "Go owns Oracle state, confidence calculation, workspace files, iteration manifests, and canonical visual output."
  wrapper_role: "Go owns the entire Oracle loop. The wrapper scopes the brief, starts the run, follows its progress, and reports Go-owned facts. Neither the TypeScript host nor the wrapper may drive Oracle iterations."
intent_refinement:
  - "Run `aether oracle propose --topic \"<raw topic>\"` first. It writes nothing and returns the suggested output shape, evidence sources, depth, accuracy target, and how many clarifying questions the topic needs, plus every option with its round count and rough duration."
  - "Every value from propose is a keyword-derived suggestion. Present them as pre-selected choices the user can change; never apply them silently."
  - "Ask how much scoping the user wants before asking anything else: Skip (0 questions), Quick (3), Standard (6), or Thorough (10), pre-selected from the proposal. Then ask that many."
  - "Draw the questions from scope, audience, desired output, constraints, non-goals, evidence sources, and what would make the answer actionable — most decision-shaping first."
  - "Synthesize the user's answers into a precise core question. Do not pass the raw vague prompt through unchanged."
  - "Present research depth as selectable options unless the user already gave one: quick (5 rounds), balanced/standard (15), deep (30), or exhaustive/marathon (50). Do not hide this behind a raw flag-only flow."
  - "If the user gives an exact iteration cap, pass `--max-iterations <1-50>`."
  - "Ask the user to choose target confidence unless they already gave one: 80%, 90%, 95% recommended, or 99%; pass the selected number as `--confidence-target <percent>`."
  - "For PRD-style work, the command wrapper owns the user interview. The PRD reference/template structures the synthesis; it is not a separate manual command the user must run."
  - "Record the approved brief with `aether oracle brief --core-question \"...\" --depth <depth> --confidence-target <percent>`. Use `--dry-run` to render the approval panel first; the runtime draws that panel, the wrapper must not hand-draw it."
  - "Start the run with `AETHER_OUTPUT_MODE=visual aether oracle --from-brief --background --follow`. `--from-brief` fails when no brief has been approved; that refusal is the gate, so do not route around it by passing the topic directly unless the user explicitly asks to skip scoping."
  - "`--background` keeps a long run from timing out the host tool call; `--follow` streams one line per round with the phase, round number, confidence against target, and current question. Both together are the normal path."
  - "When the runtime detects a hosted Claude/OpenCode agent session and the command is not already backgrounded, it auto-detaches the Oracle controller instead of running a long foreground nested worker loop."
  - "If the user asks for 'everything', 'all of the above', a full-system audit, or a large uncommitted diff review, split the work into focused Oracle prompts or run an explicit quick triage first with `--depth quick`; do not collapse every area into one blocking balanced-depth prompt."
  - "When the user doubts Oracle works, run `aether oracle selftest --dry-run` for setup checks and `aether oracle selftest` for one real research round; it exits non-zero when any part of the machinery is broken."
guardrails:
  - "Do not write colony state files, session files, or pheromone files by hand from this command spec."
  - "Do not synthesize Oracle confidence, confidence deltas, or completion summaries in TypeScript or wrapper markdown; Go finalizers derive those from real worker_response content."
  - "If docs and runtime disagree, runtime wins."
  - "If the shell/tool call times out, immediately run `aether oracle status` and report the runtime status; do not assume Oracle failed or bypass it with ad hoc agents."
  - "`aether oracle status` only reports; it never repairs. When it flags a stale controller, `aether oracle recover` is the command that clears it."
  - "If OpenCode subprocess dispatch is unavailable, let Oracle use its automatic Codex/Claude fallback unless the user explicitly set `AETHER_WORKER_PLATFORM=opencode`."
  - "Do not fake Oracle worker completion; if no real dispatcher is available, surface the runtime error and preserve the Oracle workspace."
follow_up:
  persistence: "After oracle completes, suggest persisting high-value findings as pheromone signals (aether pheromone-write) or hive wisdom (aether hive-store). User approves each suggestion."
