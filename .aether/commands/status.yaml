name: ant-status
description: "📊 Show colony status at a glance through the Aether CLI runtime"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "AETHER_OUTPUT_MODE=visual aether status $ARGUMENTS"
ceremony_contract:
  class: "dashboard"
  authority: "Go owns status data, warning calculation, and visual dashboard rendering."
  wrapper_role: "Display current facts only. TypeScript display helpers may call `aether status` in JSON mode and render returned fields, but must not infer worker activity."
guardrails:
  - "Do not write colony state files, session files, or pheromone files by hand from this command spec."
  - "Do not claim workers were spawned, completed, blocked, or verified from status output."
  - "If docs and runtime disagree, runtime wins."
