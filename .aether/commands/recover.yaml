name: ant-recover
description: "🛟 Rescue a stuck colony — diagnose why it cannot make progress and optionally fix it"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "AETHER_OUTPUT_MODE=visual aether recover $ARGUMENTS"
flags:
  - name: apply
    description: "Apply fixes for detected issues (default: diagnose only)"
    type: boolean
    default: false
  - name: force
    description: "Allow destructive repairs (requires --apply)"
    type: boolean
    default: false
  - name: json
    description: "Output structured JSON report"
    type: boolean
    default: false
guardrails:
  - "Do not write colony state files, session files, or pheromone files by hand from this command spec."
  - "If docs and runtime disagree, runtime wins."
  - "Read-only by default; --apply required for any mutation."
  - "Relay the runtime's recovery guidance verbatim — it names the exact flags for the detected issue."
