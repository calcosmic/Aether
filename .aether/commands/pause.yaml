name: ant-pause
description: "Stop at a safe boundary and save one resumable handoff."
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "AETHER_OUTPUT_MODE=visual aether pause $ARGUMENTS"
ceremony_contract:
  class: "lifecycle"
  authority: "Go owns safe-boundary detection and the atomic handoff transaction."
  wrapper_role: "Run the canonical command, relay its handoff and receipt fields, and close with `/ant-resume`."
  result_fields:
    - "safe boundary"
    - "handoff ID"
    - "receipt ID"
    - "provenance"
  replay: "Already paused; the existing validated handoff was retained."
guardrails:
  - "Do not inspect or mutate host state; the runtime owns every durable write."
  - "Do not invent a recovery route; `/ant-resume` is the only closeout."
  - "If docs and runtime disagree, runtime wins."
  - "Show this output to the owner in your own reply, unchanged — you are only passing along what the command already produced, not deciding, checking, or changing anything yourself."
  - "Show it in a fenced text block, from the first banner line (the line drawn with `━━`) to the end; leave out any running commentary above that line. After it, add at most two short sentences of your own, and never restate or replace the screen."
