name: ant-continue
description: "👁️ Verify build work, extract learnings, and advance the colony"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  default_command: "AETHER_OUTPUT_MODE=visual aether continue --verification-depth standard $ARGUMENTS"
  manifest_command: "aether host continue --dry-run --classic-ceremony $ARGUMENTS"
  finalizer_command: "aether continue-finalize --completion-file <completion_file>"
  contract: ".aether/docs/wrapper-host-contract.md"
ownership:
  manifest_authority: "TS host (aether host continue --dry-run returns plan-only JSON without dispatching workers)"
  worker_conductor: "Wrapper (spawns reviewers via platform Agent tool for heavy review; Go runtime handles default path)"
  state_mutator: "Go runtime (continue-finalize commits results; default continue command handles everything)"
ceremony_contract:
  class: "progress"
  authority: "Go owns deterministic verification, gate assessment, learning capture, signal housekeeping, phase advancement, and canonical continue output."
  wrapper_role: "Default continue shows runtime verification progress. Only heavy external review may render worker theatre, and only from a runtime-provided continue manifest fetched via --dry-run."
codex_orchestration:
  category: "semi-intelligent"
  skill: "aether-colony-build-cycle"
  guide: "aether command-guide continue --platform codex"
  drift_guard: "Update this YAML, Claude/OpenCode wrappers, the Codex skill, and cmd/command_guide.go together."
wrapper_additions:
  stage_skeleton: |
    D-05 stage order for `## Default Continue`, `## Heavy External Review`,
    and `## After Continue`: one colony beat line, then `**Purpose:**`,
    `**Reads:**`, `**Spawns:**` where applicable, then the stage's
    imperative instructions and command blocks, then `**Stop conditions:**`.
    `## Required Cross-Stage State` carries `phase_id`, `verification_depth`,
    `verification_status`, `manifest_file` (heavy path only), and
    `next_action` forward between stages.
  pre_continue: |
    Ground continue before running the runtime-owned verification path:
    1. Run `AETHER_OUTPUT_MODE=visual aether status` to see current colony state, phase progress, and active signals.
    2. Frame continue as the colony's inspection point, not another build pass.
    3. Immediately run the default continue command unless the user explicitly requested `--classic-ceremony`, `--verification-depth heavy`, or `--heavy`.
  orchestration: |
    Default path:
    1. Run `AETHER_OUTPUT_MODE=visual aether continue --verification-depth standard $ARGUMENTS`.
    2. Do not use plan-only, spawn wrapper workers, or call continue-finalize on the default path.

    Heavy external review path:
    1. Only when the user explicitly requested `--classic-ceremony`, `--verification-depth heavy`, or `--heavy`, or the runtime specifically asks for wrapper-spawned review workers, fetch the manifest from the TS host in plan-only mode: run `aether host continue --dry-run --classic-ceremony $ARGUMENTS`. The TS host calls `aether continue --plan-only --classic-ceremony` and returns JSON without dispatching workers. The TS host is the sole manifest authority (per `.aether/docs/wrapper-host-contract.md`). `aether host continue --dry-run --verification-depth heavy $ARGUMENTS` remains equivalent for callers that already use the depth flag.
    2. Parse `result.manifest.continue_manifest`; do not parse visual output. Save the full JSON envelope to a temporary manifest file outside `.aether/data/`.
    3. Before rendering spawn ceremonies or spawning reviewers, inspect `result.manifest.continue_manifest` for `orchestrator_boundary_guidance`. If it is active or `next` is `aether discuss`, stop the heavy-review flow, show its summary, route to `aether discuss`, tell the user to rerun `after_discuss_next`, and request a fresh manifest after the answer is resolved. Do not reuse the pre-discuss manifest.
    4. Render `AETHER_FORCE_COLOR=1 AETHER_OUTPUT_MODE=visual aether ceremony spawn-plan --workflow continue --manifest-file <manifest_file>` so the user sees the heavy-review spawn plan before reviewers appear.
    5. Use visible live Task/subagent panels as the heavy-review ceremony. Do not set `run_in_background`, do not describe reviewers as background agents, and do not replace the live stack with a markdown worker table.
    6. Pass each dispatch's runtime-provided `brief` verbatim. The brief includes read cache discipline; if a reviewer keeps re-reading the same unchanged file or artifact, stop waiting and mark that reviewer `blocked` with the concrete missing context.
    7. Before each execution wave, render `AETHER_FORCE_COLOR=1 AETHER_OUTPUT_MODE=visual aether ceremony wave-start --workflow continue --manifest-file <manifest_file> --execution-wave <execution_wave>`.
    8. For each planned dispatch, call `aether spawn-log`, spawn the matching platform agent using `agent_name`, then call `aether spawn-complete`.
    9. Write per-reviewer JSON and the final completion JSON under `${TMPDIR:-/tmp}/aether-continue-<run>/continue-completion.json`; never write wrapper result artifacts under `.aether/data`.
    10. After each terminal reviewer result, write that one result to an approved temp JSON file and render `AETHER_OUTPUT_MODE=visual aether ceremony worker-complete --workflow continue --worker-file <worker_file>`.
    11. Each spawned reviewer description must be caste-labelled from the manifest: `{caste emoji} {Caste} {name}: {task}`.
    12. Collect terminal worker results into a completion JSON file containing the original `continue_manifest` and a `dispatches` array.
    13. Run `AETHER_OUTPUT_MODE=json aether continue-finalize --completion-file <file>`.
    14. After the JSON finalizer succeeds, run `AETHER_OUTPUT_MODE=visual aether ceremony closeout --workflow continue --completion-file <file>` for the user-facing ceremony.
  post_continue: |
    Close from runtime output only:
    1. For the heavy external review path, run the visual closeout command first and use its next-step line as the source of truth.
    2. If the phase advanced, summarize what was verified, which review workers ran, what the colony learned, and route first to `/ant-build N+1`.
    3. If continue blocked, translate the blocker into plain language and follow the runtime's recovery command first when it surfaces one; only fall back to `/ant-continue` when the runtime stayed generic.
    4. If the colony completed, mark the achievement briefly and route first to `/ant-seal`.
    5. Mention signal housekeeping only if the runtime surfaced it, and keep that note to one short line.
    6. When signal housekeeping appears, explain what expired, what remained active, and what that means for the next phase or final seal without diffing pheromone files directly.
  verification_depth_ceremony: |
    Verification depth controls how thorough the continue review is. Three levels:
    - light: Watcher only (fastest, minimal safety net; max 3 workers)
    - standard: Watcher + Probe (default; max 4 workers)
    - heavy: Watcher + Gatekeeper + Auditor + Probe (full quality gauntlet; max 6 workers)
    The default is "standard" for intermediate phases. Final phases default to "heavy" when depth is automatic.
    Users can override any automatic depth, including final phases, with --verification-depth <light|standard|heavy>.
    Users who want the older visible review ritual can say --classic-ceremony; that asks the TS host for a heavy-review manifest (via --dry-run) and the wrapper spawns reviewers from that manifest before calling continue-finalize.
  read_only_boundary: |
    The wrapper never opens colony state, session, or pheromone files by hand
    in either direction -- not reading them, not writing them. It reads
    runtime state only through runtime commands such as `aether status` and
    the runtime's own continue output; all persistence goes through
    continue-finalize and the default continue command. This is the same
    boundary the Guardrails `Do NOT read or write colony state files by hand`
    bullet states -- the <read_only> block and the Guardrails list agree.
guardrails:
  - "Do NOT use `--plan-only` or `continue-finalize` for default fast continue."
  - "Do NOT run `aether host continue --classic-ceremony` without `--dry-run` from the wrapper; that triggers the TS host dispatched path which duplicates the wrapper's own reviewer spawning."
  - "Do NOT run `aether continue --synthetic` after real wrapper Task agents complete."
  - "Do NOT replay verification loops or reimplement runtime gate logic."
  - "Do NOT read or write colony state files by hand."
  - "Do NOT mutate COLONY_STATE.json, session.json, CONTEXT.md, or HANDOFF.md directly."
  - "Do NOT parse visual output as authoritative state."
  - "Do NOT invent worker names, castes, or waves; use `continue_manifest`."
  - "Do NOT describe platform reviewers as background agents or replace the live worker stack with a markdown table."
  - "Do NOT let reviewers loop on unchanged file reads; pass their brief verbatim and mark stuck reviewers blocked with the missing context."
  - "Do NOT add extra option menus or manual state surgery unless the runtime explicitly asks."
  - "Do NOT hand-render any visual that `aether ceremony` already renders (spawn-plan, wave-start, worker-complete, closeout)."
  - "Do NOT paraphrase or gesture at \"it's safe to clear your context now\", and do NOT route the user to `/ant-resume`; that guidance is runtime-owned and must never appear in wrapper prose."
  - "If docs and runtime disagree, runtime wins."
follow_up:
  advance: "Guide the user first to `/ant-build N+1`, with `aether build <next_phase>` remaining the runtime source of truth beneath the wrapper."
  blocked: "Guide the user through the runtime-surfaced recovery command first; only route back to `/ant-continue` when the runtime has no more specific recovery step."
  complete: "Guide the user first to `/ant-seal`, with `aether seal` remaining the runtime source of truth beneath the wrapper."
