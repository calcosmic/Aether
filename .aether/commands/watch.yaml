name: ant-watch
description: "👁️ View the current colony watch surface through the Aether CLI runtime"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "AETHER_OUTPUT_MODE=visual aether watch $ARGUMENTS"
  arguments:
    - "--once: render a single snapshot instead of refreshing in place."
    - "--interval <duration>: how often the live screen redraws (default 2s)."
ceremony_contract:
  class: "dashboard"
  authority: "Go owns live activity facts and writes the watch snapshot artifacts."
  artifacts:
    - ".aether/data/watch-status.txt"
    - ".aether/data/watch-progress.txt"
  wrapper_role: >
    The runtime alone resolves which of three screens applies, from durable
    evidence only -- the wrapper never inspects a file, computes liveness, or
    picks a screen itself. Something running now shows the live dashboard,
    updating in place. Nothing running but a prior run exists shows a
    replay-backed summary of that last episode -- what ran, how it ended, what
    it cost, and the one suggested next command. Nothing has ever run shows
    the honest idle card. Render whichever screen the runtime returns and
    nothing else.
guardrails:
  - "Do not write colony state files, session files, or pheromone files by hand from this command spec."
  - "Do not describe watch as a worker dispatch or route it through swarm-finalize/build-finalize."
  - "If docs and runtime disagree, runtime wins."
  - "Show this output to the owner in your own reply, unchanged — you are only passing along what the command already produced, not deciding, checking, or changing anything yourself."
  - "Show it in a fenced text block, from the first banner line (the line drawn with `━━`) to the end; leave out any running commentary above that line. After it, add at most two short sentences of your own, and never restate or replace the screen."
