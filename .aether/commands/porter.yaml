name: ant-porter
description: "📦 Deliver colony work -- publish, push, and deploy after seal"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "AETHER_OUTPUT_MODE=visual aether porter $ARGUMENTS"
ceremony_contract:
  class: "progress"
  authority: "Go owns delivery readiness checks, publish/push/deploy command execution, and stop-on-first-failure behavior."
  wrapper_role: "Show Porter progress and the runtime's recovery command. Do not run delivery actions unless the user explicitly chose them."
guardrails:
  - "Do not modify colony state files."
  - "If docs and runtime disagree, runtime wins."
  - "Stops on first failure -- user decides retry, skip, or abort."
  - "Never use --force flags on git push or goreleaser unless user explicitly requests."
  - "Show this output to the owner in your own reply, unchanged — you are only passing along what the command already produced, not deciding, checking, or changing anything yourself."
  - "Show it in a fenced text block, from the first banner line (the line drawn with `━━`) to the end; leave out any running commentary above that line. After it, add at most two short sentences of your own, and never restate or replace the screen."
