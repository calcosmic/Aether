name: ant-discuss
description: "💬 Capture clarifications before planning through the Aether CLI runtime"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "AETHER_OUTPUT_MODE=visual aether discuss $ARGUMENTS"
codex_orchestration:
  category: "semi-intelligent"
  skill: "aether-colony-research"
  guide: "aether command-guide discuss --platform codex"
  drift_guard: "Update this YAML, Claude/OpenCode wrappers, the Codex skill, and cmd/command_guide.go together."
ceremony_contract:
  class: "guided_ritual"
  authority: "Go owns pending-decision persistence, REDIRECT emission, and visual question rendering. The typed intake `aether discuss --add-question ... --grounding ...` materializes Queen-composed questions into the same pipeline; the runtime refuses ungrounded questions and dedups by --source slug."
  wrapper_role: "Compose 3-5 questions from THIS goal and THIS codebase (status + discuss-analyze + survey docs), each citing what it is grounded in; materialize via --add-question; present everything pending as real multiple choice; persist picks via --resolve. Fall back to the runtime's generator only when discuss-analyze returns no scan context or the goal is empty. Never invent answers or imply worker dispatch."
guardrails:
  - "Do not write `pending-decisions.json`, `pheromones.json`, or `COLONY_STATE.json` by hand from this command spec."
  - "Do not render Scout/Builder/Watcher worker theatre for discuss; this is a guided clarification ritual, not a spawned-worker lifecycle."
  - "If the runtime returns clarification questions, present them honestly instead of inventing answers on the user's behalf."
  - "If docs and runtime disagree, runtime wins."
follow_up:
  analyze: "aether discuss-analyze --target ."
  analyze_purpose: "Run before discussion to get codebase-aware suggested questions covering architecture, dependencies, testing, deployment, and performance."
  persist_answer: "AETHER_OUTPUT_MODE=visual aether discuss --resolve <id> --answer \"<choice>\""
  settled: "If the runtime reports discussion_status: settled, route wrapper users back to `/ant-plan`; direct CLI users can run `aether plan`."
  council: "Use `/ant-council` only when the user wants multi-position deliberation; `/ant-discuss` is the lightweight pre-plan clarification gate."
