name: ant-discuss
description: "💬 Resolve evidence-backed material decisions and hand settled intent to a draft specification"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "AETHER_OUTPUT_MODE=json aether discuss $ARGUMENTS"
codex_orchestration:
  category: "semi-intelligent"
  skill: "aether-colony-research"
  guide: "aether command-guide discuss --platform codex"
  drift_guard: "Update this YAML, Claude/OpenCode wrappers, the Codex skill, and cmd/command_guide.go together."
ceremony_contract:
  class: "guided_ritual"
  authority: "Go assembles the current evidence frontier, decides which unresolved choices are material or evidence-answerable, binds answer reuse to the exact goal/session/specification/base-plan meaning and consequences, persists accepted answers, and creates or retains the settled draft specification."
  wrapper_role: "Invoke the structured runtime result; render every card in `material_batch.cards` with its decision, why-now evidence, Queen recommendation, viable-choice consequences, prior-answer revalidation, planning-resume description, and `exact_answer_syntax`; submit only the owner's explicit answer through that runtime command; then request a fresh result. When settled, render the runtime's exact specification result and route to `/ant-spec`."
  material_batch: "The runtime returns the complete batch of decisions it found material. Render every card first; do not truncate, rewrite or answer a Go-issued card."
  owner_interview: "The owner's ruling (2026-09-26): before a draft description goes to `/ant-spec`, interview the owner. After Go's own `material_batch.cards` are answered, or when there are none, compose about 20 multiple-choice questions specific to this goal and this project: what the result looks like, what is in and out of scope, how it should behave, the quality and style it must meet, what must never happen, and how the owner will check it. Ground every question in the goal, the charter, the codebase map and files you can read. Never ask what the goal, Go's resolved answers, or an earlier interview already settled, and never fall back to a generic canned question list. Ask them up to 4 at a time with the platform's own multiple-choice question tool (AskUserQuestion in Claude Code; a numbered list where there is none), 2-4 options each, the recommended option first and marked \"(Recommended)\", every option saying its real-world consequence in plain words. The owner may always give his own answer, or say \"enough\" to stop early. Fewer than 20 is fine only when the goal genuinely has fewer real decisions; say so when that happens. Record each question before asking it: `aether discuss --add-question \"<question>\" --options \"<option 1>|<option 2>\" --grounding \"<what it is based on>\" --category <surface|integration|scope|verification|analysis> --source <short-stable-slug>` (add `--hard` when the answer is a must-never rule), and each pick after he answers: `aether discuss --resolve <id> --answer \"<the option he chose, or his own words>\"`. Nothing is recorded without the owner's explicit pick. Never answer for him. When the interview is done, rerun `AETHER_OUTPUT_MODE=json aether discuss`. Go writes every answer into the draft description; show the returned page, including its \"What you decided\" section, then route to `/ant-spec`. If this project already had an interview, ask once whether he wants more questions instead of starting over."
  exact_resume: "After each answer, consume a fresh Go result and continue only from its remaining batch or exact next command. Never reuse a batch across a changed goal, session, specification revision, base plan, meaning, behavior, authority, risk, scope, acceptance impact, or affected semantic IDs."
  settled: "Settled intent produces or retains a specification result. A new result is explicitly `draft` and remains unauthorized for planning until the owner reviews and approves that exact revision through `/ant-spec`; discussion never approves a specification or a plan."
guardrails:
  - "Do not write `pending-decisions.json`, `pheromones.json`, `COLONY_STATE.json`, `.aether/SPEC.md`, or lifecycle receipts by hand from this command spec."
  - "Compose questions only for the owner interview, and record them only through `aether discuss --add-question`; do not classify materiality, decide answer equivalence, fabricate evidence, invent receipts, infer draft state, or claim approval in the wrapper."
  - "Do not render Scout/Builder/Watcher worker theatre for discuss; this is a guided owner-decision ritual, not a spawned-worker lifecycle."
  - "A platform-native question card may render the structured choices, but nothing is recorded without the owner's explicit pick and the exact Go-owned answer command."
  - "Never route settled discuss directly to `/ant-plan`; the next public boundary is `/ant-spec`."
  - "If docs and runtime disagree, runtime wins."
follow_up:
  persist_answer: "Use the card's exact `exact_answer_syntax`: `aether discuss --resolve <id> --answer \"<answer>\"`."
  resume: "Rerun `AETHER_OUTPUT_MODE=json aether discuss` after an answer and consume the newly issued batch, draft, or exact next command."
  settled: "Render `draft_spec` or the retained `approved_spec` exactly as returned and route wrapper users to `/ant-spec`. A draft is not approval and cannot authorize planning or build."
  council: "Use `/ant-council` only when the user wants multi-position deliberation; `/ant-discuss` owns evidence-first material intent decisions."
