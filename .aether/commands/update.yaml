name: ant-update
description: "🔄 Update Aether safely from the global hub (transactional)"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "AETHER_OUTPUT_MODE=visual aether update $ARGUMENTS"
ceremony_contract:
  class: "progress"
  authority: "Go owns hub freshness checks, companion-file sync, binary download decisions, stale publish detection, and local state preservation."
  wrapper_role: "Run the literal runtime command and show its progress/result summary. Do not imply worker dispatch or publish source-checkout changes from a target-repo update."
guardrails:
  - "Do not write colony state files, session files, or pheromone files by hand from this command spec."
  - "State clearly that update syncs companion files only and does not update the binary unless --download-binary is passed."
  - "Surface hub-ahead-of-binary version skew prominently as action-required, never as an informational footnote."
  - "If docs and runtime disagree, runtime wins."
  - "Show this output to the owner in your own reply, unchanged — you are only passing along what the command already produced, not deciding, checking, or changing anything yourself."
  - "Show it in a fenced text block, from the first banner line (the line drawn with `━━`) to the end; leave out any running commentary above that line. After it, add at most two short sentences of your own, and never restate or replace the screen."
