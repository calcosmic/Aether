name: ant-unblock
description: "🔧 Show blocked gates and optionally dispatch Fixer to repair them"
source_of_truth: "Use the Go `aether` CLI as the source of truth."
runtime:
  command: "AETHER_OUTPUT_MODE=visual aether unblock $ARGUMENTS"
guardrails:
  - "Do not write colony state files, session files, or pheromone files by hand from this command spec."
  - "Do not re-implement gate evaluation or Fixer dispatch — `aether unblock` owns both."
  - "If docs and runtime disagree, runtime wins."
