id: "build"
entry_agent: "queen"
required_agents:
  - "queen"
  - "builder"
  - "watcher"
  - "scout"
  - "chaos"
  - "probe"
  - "measurer"
  - "ambassador"
  - "archaeologist"
inputs:
  phase_number:
    type: "string"
    required: true
  depth:
    type: "string"
    required: false
outputs:
  - "build_summary"
  - "spawn_metrics"
  - "verification_report"
success_criteria:
  - "All waves executed in order with no skipped dependencies"
  - "Each worker's task output is verified"
  - "COLONY_STATE.json reflects completed phase progress"
failure_policy: "retry"
ceremony:
  stages:
    - "prep"
    - "context"
    - "wave"
    - "verify"
    - "complete"
