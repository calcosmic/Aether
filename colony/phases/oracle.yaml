id: "oracle"
entry_agent: "oracle"
required_agents:
  - "oracle"
  - "sage"
inputs:
  topic:
    type: "string"
    required: true
  depth:
    type: "string"
    required: false
outputs:
  - "research_findings"
  - "recommendations"
success_criteria:
  - "RALF loop completed"
  - "Confidence evaluation passed"
  - "Research plan delivered"
failure_policy: "retry"
ceremony:
  stages:
    - "research"
    - "analyze"
    - "learn"
    - "finalize"
