id: "continue"
entry_agent: "queen"
required_agents:
  - "queen"
  - "watcher"
  - "probe"
  - "gatekeeper"
  - "auditor"
  - "weaver"
inputs:
  phase_number:
    type: "string"
    required: false
  flags:
    type: "object"
    required: false
outputs:
  - "verification_report"
  - "gate_results"
  - "phase_advancement"
success_criteria:
  - "Verification loop passes with fresh evidence"
  - "Spawn gate satisfied"
  - "Anti-pattern gate passed"
failure_policy: "retry"
ceremony:
  stages:
    - "verify"
    - "gates"
    - "advance"
    - "finalize"
