id: "init"
entry_agent: "queen"
required_agents:
  - "queen"
inputs:
  goal:
    type: "string"
    required: true
outputs:
  - "colony_state"
  - "session_id"
success_criteria:
  - "COLONY_STATE.json created"
  - "session.json initialized"
failure_policy: "block"
ceremony:
  stages:
    - "setup"
    - "validate"
    - "commit"
