id: "discuss"
entry_agent: "queen"
required_agents:
  - "queen"
  - "scout"
inputs:
  goal:
    type: "string"
    required: true
  context:
    type: "object"
    required: false
outputs:
  - "clarifications"
  - "pending_decisions"
success_criteria:
  - "Intent clarified"
  - "Pending decisions recorded"
failure_policy: "skip"
ceremony:
  stages:
    - "explore"
    - "clarify"
    - "record"
