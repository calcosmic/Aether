id: chronicler
role: chronicler
prompt_file: colony/prompts/chronicler.md
allowed_tools:
- read
- write
- edit
- grep
- glob
tier: specialist
model: inherit
color: cyan
description: Use this agent when documentation is missing, outdated, or needs to be
  generated from code — READMEs, API docs, JSDoc/TSDoc inline comments, architecture
  diagrams in text, and changelogs. Invoke after a feature is complete and needs documentation,
  or when documentation gaps are identified in an audit. Does not modify source logic
  — documentation only. Reports gaps it cannot fill for Builder or Keeper to address.
