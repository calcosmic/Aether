id: builder
role: builder
prompt_file: colony/prompts/builder.md
allowed_tools:
- read
- write
- edit
- bash
- grep
- glob
tier: core
model: sonnet
color: yellow
description: Use this agent when implementing code from a plan, creating files to
  spec, executing builds, running commands, or applying TDD cycles. Spawned by /ant-build
  and /ant-continue when the colony needs hands-on implementation. Also use when debugging
  requires the 3-Fix Rule or when systematic file creation and modification is needed.
