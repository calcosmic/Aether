id: fixer
role: fixer
prompt_file: colony/prompts/fixer.md
allowed_tools:
- read
- grep
- glob
tier: specialist
model: sonnet
color: '#f1c40f'
description: 'Use this agent when gate checks fail and the colony needs autonomous
  repair. Spawned by `/ant-unblock --dispatch` to investigate root causes, propose
  or apply fixes, and verify gate resolution. Three autonomy modes: full (autonomous),
  propose (wait for approval, default), advise (diagnostic only).'
