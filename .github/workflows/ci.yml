name: Aether CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Validate goreleaser config
        run: goreleaser check

      - name: Build
        run: go build ./cmd/aether

      - name: Vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./... -count=1 -timeout 900s

      - name: Run Go tests with race detection
        run: go test ./... -race -count=1 -timeout 2400s

      - name: Resolve source release version
        id: source-version
        run: |
          SOURCE_VERSION="$(node -p "require('./.aether/version.json').version")"
          NPM_VERSION="$(node -p "require('./npm/package.json').version")"
          test "$NPM_VERSION" = "$SOURCE_VERSION"
          echo "version=$SOURCE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build GoReleaser snapshot
        env:
          AETHER_RELEASE_VERSION: ${{ steps.source-version.outputs.version }}
        run: goreleaser release --snapshot --clean

      - name: Binary smoke test
        run: |
          BINARY_VERSION="$(./dist/Aether_linux_amd64_v1/aether version | python3 -c 'import json, sys; print(json.load(sys.stdin)["result"])')"
          test "$BINARY_VERSION" = "${{ steps.source-version.outputs.version }}"

      - name: Install staged release through packed npm
        env:
          AETHER_RELEASE_ACCEPTANCE_DIR: dist
        run: go test ./cmd -run '^TestStagedGoReleaserArtifactsInstallThroughPackedNPM$' -count=1 -v

      - name: Verify bundled narrator package
        run: |
          npm --prefix .aether/ts ci
          npm --prefix .aether/ts audit --package-lock-only --audit-level=low
          npm --prefix .aether/ts run build
          git diff --exit-code -- .aether/ts/dist/narrator.js
          npm --prefix .aether/ts run typecheck
          npm --prefix .aether/ts test
          go run ./cmd/aether visuals-dump --json > /tmp/aether-visuals.json
          mv .aether/ts/node_modules .aether/ts/node_modules.disabled
          printf '%s\n' '{"topic":"ceremony.build.spawn","payload":{"phase":1,"caste":"builder","name":"Mason-67","status":"starting"}}' | node .aether/ts/dist/narrator.js --visuals /tmp/aether-visuals.json
          mv .aether/ts/node_modules.disabled .aether/ts/node_modules

      - name: Verify TypeScript host package
        run: |
          npm --prefix .aether/ts-host ci
          npm --prefix .aether/ts-host run typecheck
          npm --prefix .aether/ts-host test
          npm --prefix .aether/ts-host run build

      - name: Run npm bootstrap tests
        run: npm --prefix npm test

      - name: Parity tests
        run: go test ./cmd/... -run "TestParity|TestGoOnly" -count=1 -timeout 900s -v

      - name: Verify command catalog classification
        run: python3 scripts/verify_catalog_classified.py --strict

      - name: Verify subcommand wiring and CLI flag contracts
        run: go test ./cmd -run 'TestNoRegisteredSubcommandIsUnreferenced|TestCallerEvidenceCreditsCommandSubstitution|TestCallerEvidenceIsNotSharedBetweenSameLeafNames|TestRatchetDoesNotConsultTheRegeneratedCatalog|TestOrphanAllowlistOnlyShrinks|TestOrphanAllowlistIsPathKeyed|TestPathMigrationDidNotWidenTolerance|TestPathMigrationRejectsASameLeafNewcomer|TestPreMigrationSnapshotIsFrozen|TestRatchetDetectsASyntheticOrphan|TestDeletingACallerMakesTheRatchetNameIt|TestWiringGuardsHaveNoRuntimeEscapeHatch|TestCommandCallsMatchCobraContracts|TestAuditDetectsPositionalDrift|TestAetherCorpusCatchesAnUnregisteredFlag|TestCommandCallExtractorSeesRealInvocationsAndSkipsProse|TestDocumentedCommandNamesResolve|TestDocumentedSubcommandsAreSeverityClassified|TestGateClassifiedCallsHaveGateWiring|TestCLIFlagAudit|TestCLIFlagAuditSubcommandsRegistered|TestFlagAuditSkipListOnlyShrinks|TestAllowlistPolicyNamesEveryGuardedFile|TestSpawnCanSpawnAcceptsDocumentedInvocation|TestSpawnCanSpawnEnforceDeniesWithNonZeroExit|TestWiringGateStepRunsEveryWiringTest|TestBlanketGateCheckRejectsADecoyStep|TestExtractorDoesNotDesyncOnGluedFenceMarker|TestAuditedCorpusHasNoGluedFenceMarkers|TestReleaseGateCommandFailsATreeWithAFailingTest|TestGateProbeCatchesEveryKnownGateNeutering|TestReleaseGateWorkflowActuallyRuns|TestReleaseGateWorkflowShapeIsWhitelisted|TestWorkflowShapeWhitelistRejectsUnenumeratedKeys|TestSpawnLogDerivesDepthFromRecordedParent|TestSpawnTreeDepthReportsTwoForAThreeLevelTree|TestSpawnLogIgnoresCallerSuppliedDepth|TestSpawnLogRefusesAnUnknownParentAndWritesNothing|TestSpawnRootSentinelsCoverEveryDocumentedCoordinatorParent|TestWorkersMdStatesOneDepthConvention|TestSpawnCanSpawnDeniesPastDepthCap|TestSpawnCanSpawnAllowsWithinCap|TestSpawnLogRefusesPastCapAndWritesNoEntry|TestSpawnCanSpawnPositionalStillWinsOverFlag|TestSpawnCanSpawnNameOverridesClaimedDepth|TestNoDelegationGuardContractStubSurvives|TestSpawnCanSpawnSwarmFailsClosedOnUnreadableColonyState|TestSpawnCanSpawnSwarmFailsClosedOnUnreadableSpawnTree|TestSpawnCanSpawnSwarmAllowsWhenStateAndTreeAreBothReadable|TestSpawnTreeBudgetRefusesTheTwentyFirstHelper|TestSpawnTreeBudgetIsNotRestoredBetweenWaves|TestSpawnTreeBudgetAndWaveCapAreSeparateQuantities|TestSpawnTreeBudgetFailsClosedWhenTheTreeIsUnreadable|TestBudgetCeilingWritesMiddenButDepthRefusalDoesNot|TestSpawnCanSpawnDeniesAncestorCycle|TestSpawnAncestorCheckAllowsDifferentTaskSameCaste|TestSpawnAncestorCheckAllowsSameTaskDifferentCaste|TestNormalizeSpawnTaskMatchesOnlyWhitespaceCaseAndTrailingStop|TestSpawnAncestorCheckFailsClosedOnUnreadableTree|TestSpawnTreeActiveRendersIndentedByDepthMidRun|TestSpawnTreeActiveShowsNoRawIdentifiersOrJSON|TestSpawnTreeActiveMutatesNothing|TestSpawnTreeActiveKeepsItsJSONContract|TestSpawnReapReleasesBudgetForStaleEntryOnly|TestSpawnReapNeverTouchesAnEntryInsideTheThreshold|TestSpawnReapRespectsRefreshedActivity|TestSpawnReapThresholdIsConfigurable|TestSpawnOrphansListingMutatesNothing|TestEveryDelegationGuardFailsClosedOnItsOwnUnreadableInputs|TestDelegationGuardTableCoversEveryGuardCommand|TestCorruptingTheLedgerDoesNotResetTheWholeRunBudget|TestErasingTheRunRecordDoesNotResetTheWholeRunBudget|TestAFreshColonyWithNoLedgerIsStillAllowedToSpawn' -count=1 -timeout 900s -v

      - name: Test summary
        if: always()
        run: |
          echo "Go tests: $(go test ./... -count=1 -timeout 900s -v 2>&1 | grep -c '--- PASS' || echo 'unknown') passed"
