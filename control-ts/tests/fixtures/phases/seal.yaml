id: "seal"
entry_agent: "queen"
required_agents:
  - "queen"
  - "auditor"
  - "chronicler"
  - "sage"
inputs:
  milestone:
    type: "string"
    required: false
outputs:
  - "seal_report"
  - "archive"
success_criteria:
  - "Final review completed"
  - "Auditor gate passed"
  - "Archive created"
failure_policy: "block"
ceremony:
  stages:
    - "review"
    - "audit"
    - "document"
    - "archive"
