id: "swarm"
entry_agent: "queen"
required_agents:
  - "queen"
  - "tracker"
  - "fixer"
  - "builder"
inputs:
  bug:
    type: "string"
    required: true
  priority:
    type: "string"
    required: false
outputs:
  - "investigation_report"
  - "fixes"
success_criteria:
  - "Parallel bug investigation completed"
  - "Tracker dispatched"
  - "Fixer dispatched"
failure_policy: "escalate"
ceremony:
  stages:
    - "investigate"
    - "track"
    - "fix"
    - "verify"
