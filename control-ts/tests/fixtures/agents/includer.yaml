id: includer
role: includer
prompt_file: ../../colony/prompts/includer.md
allowed_tools:
- read
- grep
- glob
tier: specialist
model: inherit
color: blue
description: Use this agent when an interface needs accessibility review — performs
  static analysis of HTML structure, ARIA attributes, semantic markup, color contrast
  declarations in CSS and design tokens, and keyboard navigation patterns against
  WCAG 2.1 AA criteria. Invoke before merge when accessibility is a requirement, or
  when users report accessibility issues. Returns violations with WCAG criterion references
  and fix suggestions for Builder. Analysis is manual and static — no automated scanner.
