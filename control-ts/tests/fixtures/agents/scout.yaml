id: scout
role: scout
prompt_file: ../../colony/prompts/scout.md
allowed_tools:
- read
- grep
- glob
- websearch
- webfetch
tier: core
model: sonnet
color: cyan
description: Use this agent for research, documentation exploration, codebase analysis,
  and gathering information before implementation. Spawned by /ant-build and /ant-oracle
